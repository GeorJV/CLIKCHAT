<!DOCTYPE html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide:bot.svg?color=%236366f1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Clikchat | Conversational Sales AI SaaS</title>
    <script>
      (function() {
        try {
          var h = window.location.hostname.toLowerCase();
          var p = window.location.pathname.toLowerCase();
          var m = localStorage.getItem('clikchat_view_mode');
          var isCrm = h.includes('clikchatcrm') || h.startsWith('crm.') || p.startsWith('/crm') || p.startsWith('/user/mi-negocio') || p === '/dashboard' || m === 'vocero_crm' || (!m && !p.startsWith('/super-admin'));
          if (isCrm && m !== 'clikchat_classic') {
            document.documentElement.setAttribute('data-theme', 'crm');
            document.documentElement.style.backgroundColor = '#f6f8fc';
          }
        } catch(e) {}
      })();
    </script>
    <!-- Google Fonts Inter & Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
